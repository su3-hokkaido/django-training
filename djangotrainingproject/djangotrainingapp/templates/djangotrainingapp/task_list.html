<h1>ToDo List!!!</h1>
<a href="{% url 'task-create' %}">タスク作成</a>

<table>
  <tr>
    <th>Tasks</th>
  </tr>
  {% for task in tasks %}
  <tr>
    <td>{{task.title}}</td>
    <td><a href="{% url 'task' task.id %}">Confirm</a></td>
    <td><a href="{% url 'task-update' task.id %}">Update</a></td>
  </tr>
  {% endfor %}
</table>
