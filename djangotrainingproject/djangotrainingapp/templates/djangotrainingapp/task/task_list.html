{% if request.user.is_authenticated %}
<p>{{request.user}}</p>
<form action="{% url 'logout' %}" method="post">
  {% csrf_token %}
  <button type="submit">ログアウト</button>
</form>
{% else %}
<a href="{% url 'login' %}">ログイン</a>
{% endif %}

<h1>ToDo List!!!</h1>
<a href="{% url 'task-create' %}">タスク作成</a>

<form method="get">
  {% csrf_token %}
  <input type="text" name="search-text" value="{{ search_text }}" />
  <input type="submit" value="Search!!!" />
</form>

<table>
  <tr>
    <th>Tasks</th>
  </tr>
  {% for task in tasks %}
  <tr>
    <td>{{task.title}}</td>
    <td><a href="{% url 'task' task.id %}">Confirm</a></td>
    <td><a href="{% url 'task-update' task.id %}">Update</a></td>
    <td><a href="{% url 'task-delete' task.id %}">Delete</a></td>
  </tr>
  {% empty %}
  <tr><td>No task data!</td></tr>
  {% endfor %}
</table>
